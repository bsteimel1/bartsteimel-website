<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bart Steimel — Kids</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --muted: #888;
      --accent: #c8a96e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', serif;
      min-height: 100vh;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 2.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-name {
      font-size: 1.15rem;
      letter-spacing: 0.08em;
      color: var(--accent);
      text-decoration: none;
      font-style: italic;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--text); }
    .nav-links a.active { color: var(--accent); }

    header {
      text-align: center;
      padding: 3rem 2rem 2rem;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 2rem;
      font-weight: normal;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 0.4rem;
    }

    header p {
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 0.08em;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
      gap: 2rem;
      padding: 2.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .video-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    .playlist-section {
      text-align: center;
      padding: 2.5rem 2rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .playlist-section h2 {
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.4rem;
      font-weight: normal;
    }

    .playlist-buttons {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      flex-wrap: wrap;
    }

    .playlist-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.65rem 1.5rem;
      border: 1px solid var(--border);
      border-radius: 3px;
      text-decoration: none;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text);
      background: var(--surface);
      transition: border-color 0.2s, color 0.2s;
    }

    .playlist-btn:hover { border-color: var(--accent); color: var(--accent); }

    .playlist-btn svg { flex-shrink: 0; }

    footer {
      text-align: center;
      padding: 2.5rem;
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      border-top: 1px solid var(--border);
    }

    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--text); }

    @media (max-width: 600px) {
      .video-grid {
        grid-template-columns: 1fr;
        padding: 1.2rem;
      }
      nav { padding: 1rem 1.2rem; }
      .nav-links { gap: 1.2rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-name" href="index.html">Bart Steimel</a>
    <ul class="nav-links">
      <li><a href="index.html">Music</a></li>
      <li><a href="videos.html">Videos</a></li>
      <li><a href="kids.html" class="active">Kids</a></li>
    </ul>
  </nav>

  <header>
    <h1>Kids</h1>
    <p>Songs &amp; videos for the little ones</p>
  </header>

  <section class="playlist-section">
    <h2>Listen to the Kids Music Playlist</h2>

        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 0C3.582 0 0 3.582 0 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8zm3.5 5.5l-1 4.5c-.07.32-.36.5-.68.44l-2.32-.52v.58c0 .28-.22.5-.5.5s-.5-.22-.5-.5V9.5l-.5-.11V11c0 .28-.22.5-.5.5s-.5-.22-.5-.5V8.84L4.82 8.6c-.38-.08-.6-.46-.5-.84l.18-.8c.08-.34.4-.56.74-.5l4.76 1.06.64-2.88c.08-.36.44-.58.8-.5.36.08.58.44.5.8z" fill="currentColor"/>

        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 0C3.582 0 0 3.582 0 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8zm3.67 11.54c-.14.22-.44.3-.66.15-1.82-1.11-4.1-1.36-6.8-.74-.26.06-.52-.1-.58-.36-.06-.26.1-.52.36-.58 2.95-.67 5.48-.38 7.52.86.23.14.3.43.16.67zm.98-2.18c-.18.28-.55.37-.83.19-2.08-1.28-5.26-1.65-7.72-.9-.3.09-.62-.08-.71-.38-.09-.3.08-.62.38-.71 2.82-.86 6.32-.44 8.69 1.03.28.17.37.54.19.77zm.08-2.27C10.15 5.6 6.3 5.47 3.98 6.17c-.36.11-.74-.09-.85-.45-.11-.36.09-.74.45-.85 2.68-.81 7.14-.66 9.96 1.07.33.19.43.61.24.93-.19.32-.6.43-.93.24-.01-.01-.02-.01-.02-.01z" fill="currentColor"/>
        </svg>
        Spotify
      </a>
    </div>
  </section>

  <main class="video-grid">

    <div class="video-card">
      <div class="video-wrapper">
        <iframe
          src="https://www.youtube.com/embed/Akl0K6CIJes"
          title="Rock'n In The Synagogue"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </div>

  </main>

  <footer>
    <a href="index.html">&larr; Back to Music</a>
    &nbsp;&nbsp;|&nbsp;&nbsp;
    &copy; 2026 Bart Steimel
  </footer>

</body>
</html>
